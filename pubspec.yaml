name: ayeaye_mobile
description: "ayeaye captain — mobile client"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # UI
  shadcn_ui: ^0.56.3
  lucide_icons_flutter: ^3.0.0
  flutter_widget_from_html_core: ^0.17.4

  # state + routing
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1

  # networking / storage
  dio: ^5.11.1
  flutter_secure_storage: ^11.1.0
  shared_preferences: ^2.5.5
  web_socket_channel: ^3.0.3

  # device
  record: ^7.1.1
  just_audio: ^0.10.6
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  flutter_timezone: ^5.1.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.5

  # misc
  intl: ^0.20.3
  timeago: ^3.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Launcher icons, generated from the same Lucide anchor the in-app wordmark
# uses. Regenerate with:
#   tool/fl pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  # Android crops adaptive icons, so the glyph and the ground are supplied
  # separately rather than as one pre-composed square.
  adaptive_icon_background: "#0D5C6B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 24
  ios: true
  # iOS rejects icons with an alpha channel.
  remove_alpha_ios: true

flutter:
  uses-material-design: true
